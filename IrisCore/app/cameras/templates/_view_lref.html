{% set can_request_activate = True %}
{% extends "_view_ref_base.html" %}

{% block device_info %}
<div class="mt-3 form-floating">
	<span class="form-control">{{ ref.name }}</span>
	<label>Device Name</label>
</div>

{% if ref.vid or ref.pid %}
<div class="mt-3 input-group input-group-sm">
	{% if ref.vid %}
	<label class="input-group-text">Device VID</label>
	<span class="form-control">{{ ref.vid }}</span>
	{% endif %}
	{% if ref.pid %}
	<label class="input-group-text">Device PID</label>
	<span class="form-control">{{ ref.pid }}</span>
	{% endif %}
</div>
{% endif %}

{% if ref.usb %}
<div class="mt-3 input-group input-group-sm">
	<label class="input-group-text">Device USB</label>
	<span class="form-control">{{ ref.usb }}</span>
</div>
{% endif %}
{% endblock %}
