{% import 'bootstrap_wtf.html' as wtf %}

<div class="card popup-form">
	<div class="card-header text-center">
		<h4>
			Create Camera
		</h4>
	</div>
	<form action="{{ url_for('cameras.new_camera') }}" method="POST">
		{{ form.hidden_tag() }}

		<div class="card-body">
			{{ wtf.form_field(form.display_name) }}
		</div>

		<div class="card-footer">
			<div class="form-hor">
				<button type="button" class="btn btn-secondary mb-3" data-modal-close>Cancel</button>
				{{ wtf.form_field(form.submit) }}
			</div>
		</div>
	</form>
</div>
