{% import 'bootstrap_wtf.html' as wtf %}

<div class="card popup-form">
	<div class="card-header text-center">
		<h4>Edit Tag {{ tag.display_name }}</h4>
	</div>
	<form action="{{ url_for('apriltag.view_tag', id=tag.id) }}" method="POST">
		{{ form.hidden_tag() }}

		<div class="card-body">

			<div class="form-hor">
				{{ wtf.form_field(form.display_name) }}
				{{ wtf.form_field(form.tag_size) }}
			</div>
			{{ wtf.form_field(form.ensure_static) }}

		</div>

		<div class="card-footer">
			<div class="form-hor">
				<button type="button" class="btn btn-secondary mb-3" onclick="closePopup()">Cancel</button>
				{{ wtf.form_field(form.submit) }}
			</div>
			<button class="btn btn-danger form-control mb-3"
					onclick="if (event.target.innerText == 'DELETE') { event.stopPropagation(); event.preventDefault(); event.target.innerText = 'ARE YOU SURE? (DELETE)' }
							else { event.preventDefault(); window.Modal.stack.at(-1).load('{{ url_for('apriltag.delete_tag', id=tag.id) }}'); }">
				DELETE
			</button>
		</div>
	</form>
</div>
